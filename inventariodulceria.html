<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dulcelandia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#7EC8F8;--card:#fff;--ink:#000;--mute:#222;--line:#8fbbe0;--pink:#FF6FAE;--mint:#34D399;--lemon:#F5B800;--red:#E5384F;--soft-mint:#C9F5E2;--soft-lemon:#FFF0B3;--soft-red:#FFD3DA;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#4FADF2,#A9DBFF) fixed;color:var(--ink);font:16px/1.5 'DM Sans',system-ui,sans-serif}
h1,h2,.num{font-family:'Fredoka','DM Sans',system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px;text-align:center}
h1{margin:0;font-size:3rem;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
@keyframes brilla{50%{box-shadow:0 0 18px var(--g),0 0 36px var(--g)}}
.btn{--g:#FF6FAE;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pink);color:#000;box-shadow:0 0 10px var(--g),0 0 22px var(--g);transition:box-shadow .2s,transform .2s}
@media(prefers-reduced-motion:no-preference){.btn{animation:brilla 2.4s ease-in-out infinite}}
.btn:hover{box-shadow:0 0 18px var(--g),0 0 40px var(--g);transform:translateY(-1px)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:#000;box-shadow:none;animation:none}
.btn.sm{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.mint{--g:#34D399;background:var(--mint)}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{--k:rgba(58,160,255,.55);background:linear-gradient(160deg,#fff,#DDF1FF);border:1px solid #BFE3FF;border-radius:18px;padding:16px 18px;box-shadow:0 0 14px var(--k),0 0 30px var(--k)}
.kpi:nth-child(2){background:linear-gradient(160deg,#fff,#E3E8FF);--k:rgba(108,123,255,.5)}
.kpi:nth-child(3){--k:rgba(255,210,60,.7)}
.kpi:nth-child(4){background:linear-gradient(160deg,#fff,#D6F8F1);--k:rgba(34,199,176,.5)}
.kpi small{color:var(--mute);font-weight:500}
.kpi .num{font-size:2rem;font-weight:700;line-height:1.2}
.kpi.alert{background:var(--soft-lemon);border-color:transparent;--k:rgba(255,190,0,.75)}
.kpi.pink{background:#FFE14D;color:#000;border-color:transparent}
.kpi.pink small{color:#000}
.faltan{background:var(--soft-red);border-radius:18px;padding:14px 18px;margin-bottom:16px}
.faltan h2{margin:0 0 8px;font-size:1.15rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border-radius:999px;padding:4px 12px;font-size:.9rem;font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.tools input{flex:1;min-width:180px}
.tablebox{box-shadow:0 0 22px rgba(255,255,255,.75);background:var(--card);border-radius:18px;border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.85rem;color:var(--mute);font-weight:500}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tag{display:inline-block;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
.ok{background:var(--soft-mint);color:#05603A}.low{background:var(--soft-lemon);color:#6B4E00}.out{background:var(--soft-red);color:#A3162B}
.act{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.act input{width:64px;padding:6px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.x{background:none;border:0;cursor:pointer;color:var(--mute);font-size:1.1rem;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--red)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
dialog{border:0;border-radius:20px;padding:24px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(26,15,43,.55)}
dialog h2{margin:0 0 14px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:10px}
label input,label select{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
header .sync{font-size:.85rem;font-weight:500;background:#fff;border-radius:999px;padding:2px 14px}
header .fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ok-pop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,40,90,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.ok-pop.show{opacity:1;pointer-events:auto}
.ok-box{background:#fff;border-radius:24px;padding:28px 36px;text-align:center;max-width:88vw;box-shadow:0 0 30px rgba(52,211,153,.8),0 0 70px rgba(52,211,153,.45);transform:scale(.85);transition:transform .25s}
.ok-pop.show .ok-box{transform:scale(1)}
.ok-box svg{width:84px;height:84px}.ok-box path{stroke-dasharray:40;stroke-dashoffset:40}
.ok-pop.show path{animation:trazo .45s .15s forwards}
@keyframes trazo{to{stroke-dashoffset:0}}
.ok-box h2{margin:8px 0 4px;font-size:1.4rem}.ok-box p{margin:0}
#login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#4FADF2,#A9DBFF);z-index:100;padding:16px}
#login[hidden]{display:none}
.lbox{background:#fff;border-radius:24px;padding:28px;width:min(380px,100%);text-align:center;box-shadow:0 0 30px rgba(58,160,255,.6),0 0 60px rgba(58,160,255,.35)}
.lbox h1{font-size:2.4rem}.lbox p{margin:6px 0 14px}.lbox form{text-align:left}#lerr{color:#A3162B;font-weight:700;text-align:center;margin:10px 0 0;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Dulcelandia</h1><div class="fila"><button class="btn" id="nuevo">+ Agregar producto</button><button class="btn ghost" id="snd">🔊 Sonido</button><button class="btn ghost" id="salir">Salir</button></div><span class="sync" id="sync"></span></header>
<section class="kpis" id="kpis"></section><section class="faltan" id="faltan" hidden></section>
<div class="tools"><input id="q" type="search" placeholder="Buscar producto…" aria-label="Buscar producto"><select id="f" aria-label="Filtrar"><option value="">Todos</option><option value="falta">Por agotarse o agotados</option><option value="ok">Con buen stock</option></select></div>
<div class="tablebox"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="r">Precio</th><th class="r">En stock</th><th class="r">Vendidos</th><th>Estado</th><th class="r">Movimiento</th><th></th></tr></thead><tbody id="tb"></tbody></table><div class="empty" id="vacio" hidden>Aún no hay productos. Toca «Agregar producto» para empezar.</div></div>
</div>
<dialog id="dlg"><form id="frm" method="dialog"><h2 id="dt">Nuevo producto</h2><label>Nombre<input id="n" required maxlength="60" placeholder="Ej. Gomitas ácidas"></label><label>Categoría<input id="c" list="cats" required maxlength="40" placeholder="Escribe o elige una categoría"></label><datalist id="cats"></datalist><div class="row2"><label>Precio de venta ($)<input id="p" type="number" min="0" step="0.5" required></label><label>Costo ($)<input id="co" type="number" min="0" step="0.5" required></label></div><div class="row2"><label>Cantidad en stock<input id="s" type="number" min="0" step="1" required></label><label>Avisar cuando queden<input id="m" type="number" min="0" step="1" value="5" required></label></div><div class="dfoot"><button type="button" class="btn ghost" id="cancel">Cancelar</button><button class="btn" id="guardar" value="ok">Guardar</button></div></form></dialog>
<div id="login" hidden><div class="lbox"><h1>Dulcelandia</h1><p>Entra para ver tu inventario</p><form id="lform"><label>Correo<input id="lmail" type="email" required autocomplete="username"></label><label>Contraseña<input id="lpass" type="password" required autocomplete="current-password"></label><button class="btn" style="width:100%">Entrar</button><p id="lerr" role="alert"></p></form></div></div>
<div class="ok-pop" id="pop" role="status" aria-live="polite"><div class="ok-box"><svg viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25" fill="#34D399"/><path d="M14 27l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><h2>Se registró correctamente</h2><p id="pop-t"></p></div></div><div class="toast" id="toast" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyBZiAe7g7fdhYv4DN6Ap06o8xDdXGgREts",authDomain:"dulcelandia-ac2ce.firebaseapp.com",projectId:"dulcelandia-ac2ce",storageBucket:"dulcelandia-ac2ce.firebasestorage.app",messagingSenderId:"1035911603101",appId:"1:1035911603101:web:23265d15f3d30530a80574",measurementId:"G-R8Z65GD5N2"};
const KEY='dulceria-inventario-v2',$=id=>document.getElementById(id),money=n=>'$'+(+n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items=[],editId=null,col=null,un=null,snd=true,ac;
function load(){try{const r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)}catch(e){}}
function localSave(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function save(it){if(col){const r={...it};delete r.id;col.doc(String(it.id)).set(r).catch(()=>toast('No se pudo guardar en la nube'))}else localSave()}
function pintaSync(ok){$('sync').textContent=ok?'☁️ Sincronizado en todos tus dispositivos':'⚠️ Sin conexión con la nube'}
function conecta(){
const wrap=document.querySelector('.wrap');firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),fs=firebase.firestore();
$('lform').onsubmit=ev=>{ev.preventDefault();const email=$('lmail').value.trim(),pass=$('lpass').value;$('lerr').textContent='Conectando con Firebase...';auth.signInWithEmailAndPassword(email,pass).then(u=>{$('lerr').textContent='';pintaSync(true)}).catch(e=>{$('lerr').textContent=e.code==='auth/invalid-credential'?'Correo o contraseña incorrectos':e.code==='auth/user-not-found'?'Usuario no encontrado':e.code==='auth/wrong-password'?'Contraseña incorrecta':e.code==='auth/too-many-requests'?'Demasiados intentos. Espera unos minutos.':e.message})};
$('salir').onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{if(un){un();un=null}if(!u){col=null;items=[];pintaSync(false);$('login').hidden=false;wrap.hidden=true;return}$('login').hidden=true;wrap.hidden=false;col=fs.collection('productos');pintaSync(true);un=col.onSnapshot(sn=>{items=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.n).localeCompare(String(b.n)));render()},()=>{pintaSync(false);toast('No se pudo conectar con Firestore. Revisa las reglas.')})});
}
function tono(f,t,d,tipo,v){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),T=ac.currentTime+t;o.type=tipo||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d+.02)}catch(e){}}
function listo(t){tono(660,0,.12);tono(880,.1,.12);tono(1320,.2,.25);$('pop-t').textContent=t;$('pop').classList.add('show');clearTimeout(listo.t);listo.t=setTimeout(()=>$('pop').classList.remove('show'),1600)}
$('pop').onclick=()=>$('pop').classList.remove('show');
document.addEventListener('click',e=>{if(e.target.closest('button'))tono(700,0,.07,'triangle',.12)});
function pintaSnd(){$('snd').textContent=snd?'🔊 Sonido':'🔇 Sin sonido'}
$('snd').onclick=()=>{snd=!snd;try{localStorage.setItem('dulci-snd',snd?'1':'0')}catch(e){}pintaSnd()}
function toast(t){tono(220,0,.2,'square',.08);const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
const estado=i=>i.s<=0?['out','Agotado']:i.s<=i.m?['low','Por agotarse']:['ok','Bien'];
function render(){
const q=$('q').value.trim().toLowerCase(),f=$('f').value,falta=items.filter(i=>i.s<=i.m);$('cats').innerHTML=[...new Set(items.map(i=>i.c))].map(c=>`<option value="${esc(c)}">`).join('');
const valor=items.reduce((a,i)=>a+i.s*i.co,0),ingresos=items.reduce((a,i)=>a+i.v*i.p,0),ganancia=items.reduce((a,i)=>a+i.v*(i.p-i.co),0);
$('kpis').innerHTML=`<div class="kpi"><small>Productos</small><div class="num">${items.length}</div></div><div class="kpi"><small>Valor del inventario (a costo)</small><div class="num">${money(valor)}</div></div><div class="kpi pink"><small>Ventas registradas</small><div class="num">${money(ingresos)}</div></div><div class="kpi"><small>Ganancia estimada</small><div class="num">${money(ganancia)}</div></div><div class="kpi ${falta.length?'alert':''}"><small>Por surtir</small><div class="num">${falta.length}</div></div>`;
const fb=$('faltan');if(falta.length){fb.hidden=false;fb.innerHTML=`<h2>Hay que surtir</h2><div class="chips">${falta.map(i=>`<span class="chip">${esc(i.n)}: ${i.s<=0?'agotado':'quedan '+i.s}</span>`).join('')}</div>`}else fb.hidden=true;
const list=items.filter(i=>(!q||i.n.toLowerCase().includes(q)||i.c.toLowerCase().includes(q))&&(f===''||(f==='falta'?i.s<=i.m:i.s>i.m)));$('vacio').hidden=items.length>0;
$('tb').innerHTML=list.map(i=>{const[e,t]=estado(i);return `<tr><td><strong>${esc(i.n)}</strong></td><td>${esc(i.c)}</td><td class="r">${money(i.p)}</td><td class="r"><strong>${i.s}</strong></td><td class="r">${i.v}</td><td><span class="tag ${e}">${t}</span></td><td><div class="act"><input type="number" min="1" value="1" id="q${i.id}" aria-label="Cantidad de ${esc(i.n)}"><button class="btn sm" data-a="vende" data-id="${i.id}">Vender</button><button class="btn sm mint" data-a="surte" data-id="${i.id}">Surtir</button></div></td><td><button class="x" data-a="edita" data-id="${i.id}">✎</button><button class="x" data-a="borra" data-id="${i.id}">✕</button></td></tr>`}).join('');
}
$('tb').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=items.find(x=>x.id==b.dataset.id);if(!i)return;const a=b.dataset.a,qty=Math.max(1,parseInt($('q'+i.id)?.value)||1);if(a==='vende'){if(qty>i.s){toast('Solo quedan '+i.s+' de '+i.n);return}i.s-=qty;i.v+=qty;listo('Vendido: '+qty+' × '+i.n+' ('+money(qty*i.p)+')')}else if(a==='surte'){i.s+=qty;listo('Surtido: +'+qty+' '+i.n)}else if(a==='borra'){if(!confirm('¿Eliminar «'+i.n+'»?'))return;items=items.filter(x=>x!==i);if(col)col.doc(String(i.id)).delete().catch(()=>toast('No se pudo eliminar'));else localSave();render();return}else if(a==='edita'){abre(i);return}save(i);render()});
function abre(i){editId=i?i.id:null;$('dt').textContent=i?'Editar producto':'Nuevo producto';$('n').value=i?i.n:'';$('c').value=i?i.c:'';$('p').value=i?i.p:'';$('co').value=i?i.co:'';$('s').value=i?i.s:'';$('m').value=i?i.m:5;$('dlg').showModal();$('n').focus()}
$('nuevo').onclick=()=>abre(null);$('cancel').onclick=()=>$('dlg').close();
$('frm').addEventListener('submit',()=>{const d={n:$('n').value.trim(),c:$('c').value.trim()||'Sin categoría',p:+$('p').value,co:+$('co').value,s:+$('s').value,m:+$('m').value};if(!d.n)return;if(editId){const it=items.find(x=>x.id==editId);Object.assign(it,d);listo('Producto actualizado');save(it)}else{const it={id:String(Date.now()),v:0,...d};items.push(it);listo('Producto agregado');save(it)}render()});
$('q').oninput=render;$('f').onchange=render;try{snd=localStorage.getItem('dulci-snd')!=='0'}catch(e){}pintaSnd();load();render();conecta();
</script>
</body>
</html>
